name: runner-diag

on:
  push:
    branches: [ci-diag]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: diag ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.10"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade --requirement requirements-ci.txt
      - name: Runner diagnostics
        shell: bash
        run: python diag/ci_diag.py
      - name: Runner diagnostics beside xdist-sized load
        shell: bash
        run: python diag/ci_diag.py spread relextract srl ratios regimes load
